      <div class="shell-app-name">BelegScan Pro</div>
      <div class="shell-user-info">
        <span id="shell-name">Hallo!</span> · <span id="shell-beruf" style="opacity:.6">Bereit</span>
      </div>
    </div>
    
    <!-- Säulen-Toggle -->
    <div class="pillar-toggle" id="pillar-toggle">
      <button class="pt-btn on" id="pt-business" onclick="_setPillar('business')">💼</button>
      <button class="pt-btn" id="pt-privat" onclick="_setPillar('privat')">🏠</button>
      <button class="pt-btn" id="pt-archiv" onclick="_setPillar('archiv')">📬</button>
      <button class="pt-btn" id="pt-leben" onclick="_setPillar('leben')">🌱</button>

    <span id="sh-key-trigger" style="font-size:10px; opacity:0.3; margin-left:8px; cursor:pointer;" onclick="event.stopPropagation(); _toggleApiKeyInput()">Key 🔒</span>
  </div>
  <div id="shell-header-right">
    <!-- Widgets entfernt für Redesign -->
  </div>
  <!-- Hidden API Key Input -->
  <div id="shell-api-input-wrap" style="display:none;padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--br);animation:su .2s ease">

      <input id="shell-api-key" type="password" class="sett-inp" placeholder="Anthropic API Key eingeben..." style="font-size:12px">
      <button class="btn btn-gold btn-sm" onclick="_saveShellApiKey()">Sichern</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     APP — SCROLLBARER HAUPTBEREICH
═══════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- Container für Modul-Views (wird von Modulen befüllt) -->
  <div id="module-views">

    <!-- ── HOME VIEW ──────────────────────────────────────── -->
    <div class="view on" id="v-home">
      <!-- 1. Pillar Actions (Post-its) - Top of View -->
      <div id="pillar-actions" class="pillar-actions" style="margin-bottom: 32px;"></div>

      <div class="home-hero-redesign" style="text-align: center; padding-bottom: 20px;">
        <!-- 2. Greeting (Center) -->
        <h2 id="home-greeting" style="font-size:24px; font-weight:100; color:var(--txt); margin-bottom:24px; text-align: center;">Moin!</h2>
        
        <!-- 3. Deadline Ring (Middle) -->
        <div class="deadline-ring-box" id="main-ring-box" onclick="BSP.showView('archiv-fristen')" style="margin: 0 auto 16px;">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle class="ring-fill" id="deadline-ring" cx="50" cy="50" r="45" style="stroke-dasharray: 283; stroke-dashoffset: 283;"></circle>
          </svg>
          <div class="ring-content">
            <div class="days" id="deadline-days">0</div>
            <div class="label" id="ring-label">Tage</div>
          </div>
        </div>

        <!-- 4. MwSt Dashboard (Bottom) - Business Only -->
        <div class="vat-dashboard" style="display:none; margin: 0 auto; max-width: 320px; background:transparent; border:none; box-shadow:none; padding: 0;">
          <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 16px;">
            <div style="text-align:center; flex:1;">
              <div style="font-size:10px; color:var(--txt3); text-transform:uppercase; margin-bottom:4px;">Einnahmen</div>
              <div id="qs-einnahmen" style="font-size:16px; font-weight:500; color:var(--txt);">0,00 €</div>
            </div>
            <div style="text-align:center; flex:1;">
              <div style="font-size:10px; color:var(--txt3); text-transform:uppercase; margin-bottom:4px;">MwSt</div>
              <div id="vat-saldo-val" style="font-size:16px; font-weight:500; font-family:'DM Mono', monospace; color:var(--gold);">0,00 €</div>
            </div>
            <div style="text-align:center; flex:1;">
              <div style="font-size:10px; color:var(--txt3); text-transform:uppercase; margin-bottom:4px;">Ausgaben</div>
              <div id="qs-ausgaben" style="font-size:16px; font-weight:500; color:var(--txt);">0,00 €</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Letzte Belege -->
      <div class="recent-section" style="margin-top:16px">
        <div class="section-title">Zuletzt erfasst</div>
        <div id="recent-list">
          <div class="empty">
            Noch keine Belege.<br>
            Tippe auf 📷 um deinen ersten Beleg zu scannen.
          </div>
        </div>
      </div>
    </div>

    <!-- ── Weitere Views werden von Modulen befüllt ─────── -->
    <div id="v-verpflegung" class="view"></div>
    <div id="v-einstellungen" class="view"></div>

    <!-- Archiv Extensions -->

  </div><!-- /module-views -->

<script>
const _initedPillars = new Set();

async function _initPillarModules(p) {
  if (_initedPillars.has(p)) return;
  _initedPillars.add(p);
  console.log(`[BOOT] Waking up pillar: ${p}`);
  
  if (p === 'business') {
    await BSP.safeInit('BusinessShell', typeof BusinessShell !== 'undefined' ? BusinessShell : null);
    await BSP.safeInit('ScannerModule', typeof ScannerModule !== 'undefined' ? ScannerModule : null);
    await BSP.safeInit('BelegeModule', typeof BelegeModule !== 'undefined' ? BelegeModule : null);
    await BSP.safeInit('MwStModule', typeof MwStModule !== 'undefined' ? MwStModule : null);
    await BSP.safeInit('SteuerModule', typeof SteuerModule !== 'undefined' ? SteuerModule : null);
    await BSP.safeInit('FahrtModule', typeof FahrtModule !== 'undefined' ? FahrtModule : null);
    await BSP.safeInit('VerpflegungModule', typeof VerpflegungModule !== 'undefined' ? VerpflegungModule : null);
    await BSP.safeInit('ExportModule', typeof ExportModule !== 'undefined' ? ExportModule : null);
    await BSP.safeInit('ReviewWorkflowModule', typeof ReviewWorkflowModule !== 'undefined' ? ReviewWorkflowModule : null);
    await BSP.safeInit('KontoShell', typeof KontoShell !== 'undefined' ? KontoShell : null);
    await BSP.safeInit('AboModule', typeof AboModule !== 'undefined' ? AboModule : null);
    await BSP.safeInit('EinstellungenModule', typeof EinstellungenModule !== 'undefined' ? EinstellungenModule : null);
  } else if (p === 'privat') {
    await BSP.safeInit('PrivatShell', typeof PrivatShell !== 'undefined' ? PrivatShell : null);
    await BSP.safeInit('PrivatScanModule', typeof PrivatScanModule !== 'undefined' ? PrivatScanModule : null);
    await BSP.safeInit('PrivatSpending', typeof PrivatSpending !== 'undefined' ? PrivatSpending : null);
    await BSP.safeInit('PrivatEnergie', typeof PrivatEnergie !== 'undefined' ? PrivatEnergie : null);
    await BSP.safeInit('PrivatDeals', typeof PrivatDeals !== 'undefined' ? PrivatDeals : null);
  } else if (p === 'archiv') {
    await BSP.safeInit('ArchivShell', typeof ArchivShell !== 'undefined' ? ArchivShell : null);
    await BSP.safeInit('ArchivScanModule', typeof ArchivScanModule !== 'undefined' ? ArchivScanModule : null);
    await BSP.safeInit('ArchivDocs', typeof ArchivDocs !== 'undefined' ? ArchivDocs : null);
    await BSP.safeInit('ArchivFristen', typeof ArchivFristen !== 'undefined' ? ArchivFristen : null);
    await BSP.safeInit('ArchivReise', typeof ArchivReise !== 'undefined' ? ArchivReise : null);
    await BSP.safeInit('ArchivTagebuch', typeof ArchivTagebuch !== 'undefined' ? ArchivTagebuch : null);
  } else if (p === 'leben') {
    await BSP.safeInit('LebenShell', typeof LebenShell !== 'undefined' ? LebenShell : null);
    await BSP.safeInit('LebenHome', typeof LebenHome !== 'undefined' ? LebenHome : null);
    await BSP.safeInit('LebenCore', typeof LebenCore !== 'undefined' ? LebenCore : null);
    await BSP.safeInit('LebenSplit', typeof LebenSplit !== 'undefined' ? LebenSplit : null);
    await BSP.safeInit('LebenInflation', typeof LebenInflation !== 'undefined' ? LebenInflation : null);
    await BSP.safeInit('LebenEntwicklung', typeof LebenEntwicklung !== 'undefined' ? LebenEntwicklung : null);
  }
}

async function _setPillar(p) {
  if (typeof BSP !== 'undefined' && BSP.closeAllOverlays) BSP.closeAllOverlays();
  _currentPillar = p;
  localStorage.setItem('bsp_pillar', p);
  // Kontext-Tracking für Feedback-Modul
  if (typeof BSP !== 'undefined' && BSP.state) BSP.state.activePillar = p;
  
  // 1. Theme & Header Cleanup
  document.body.className = 'p-' + p;
  document.querySelectorAll('.pt-btn').forEach(b => b.classList.toggle('on', b.id === 'pt-' + p));

  // 2. Action Bar & Ring Reset
  const actionWrap = document.getElementById('pillar-actions');
  if (actionWrap) actionWrap.innerHTML = ''; 
  
  const mainRing = document.getElementById('main-ring-box');
  const footRing = document.getElementById('action-bar-ring-box');
  if (mainRing) mainRing.style.display = (p === 'business' || p === 'privat') ? 'flex' : 'none';
  if (footRing) footRing.style.display = p === 'business' ? 'block' : 'none';

  // 3. Module wecken
  await _initPillarModules(p);

  // 4. Pillar-spezifische Sub-Navigation & Actions
  const nav = document.getElementById('shell-nav');
  if (nav) {
    if (p === 'business') {
      nav.innerHTML = `
        <button class="nav-btn on" data-nav="home" onclick="BSP.showView('home')">Home</button>
        <button class="nav-btn" data-nav="belege" onclick="BSP.showView('belege')">Belege</button>
        <button class="nav-btn" data-nav="mwst" onclick="BSP.showView('mwst')">MwSt</button>
        <button class="nav-btn" data-nav="einstellungen" onclick="BSP.showView('einstellungen')">Archiv</button>
      `;
      if (actionWrap) {
        actionWrap.innerHTML = `
          <div class="pa-card" onclick="BSP.showView('konto')">🏦 Bankkonten</div>
          <div class="pa-card" onclick="BSP.showView('abos')">🔁 Abos</div>
          <div class="pa-card" onclick="BSP.showView('fahrt')">🚗 Fahrten</div>
          <div class="pa-card" onclick="BSP.showView('verpflegung')">🍱 Verpflegung</div>
          <div class="pa-card" onclick="BSP.showView('steuer')">🏛️ Steuer</div>
          <div class="pa-card" onclick="BSP.showView('setup')">⚙️ Setup</div>
        `;
      }
    } else if (p === 'privat') {
      nav.innerHTML = `<button class="nav-btn on">Übersicht</button><button class="nav-btn">Einkauf</button>`;
      if (actionWrap) actionWrap.innerHTML = `<div class="pa-card">🛒 Einkaufsliste</div><div class="pa-card">✨ Deals</div>`;
    } else if (p === 'archiv') {
      nav.innerHTML = `<button class="nav-btn on">Dokumente</button><button class="nav-btn">Fristen</button>`;
      if (actionWrap) actionWrap.innerHTML = `<div class="pa-card">📁 Docs</div><div class="pa-card">⏳ Fristen</div>`;
    } else if (p === 'leben') {
      nav.innerHTML = ``;
    }
  }

  _updateShellHeader();
  BSP.showView('home');
  _renderHome();
  BSP.emit('pillar:changed', { pillar: p });
}

// ── App Start ───────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  console.log('--- [BOOT-V3] STARTING ---');
  try {
    await BSP.init();
    console.log('[BOOT] BSP.init OK');
    
    await BSP.safeInit('OnboardingModule', typeof OnboardingModule !== 'undefined' ? OnboardingModule : null);
    await BSP.safeInit('SpracheUniversal', typeof SpracheUniversal !== 'undefined' ? SpracheUniversal : null);
    await BSP.safeInit('StiftModule', typeof StiftModule !== 'undefined' ? StiftModule : null);
    await BSP.safeInit('NotificationModule', typeof NotificationModule !== 'undefined' ? NotificationModule : null);
    console.log('[BOOT] Base modules safeInit calls done');

    const startPillar = localStorage.getItem('bsp_pillar') || 'business';
    console.log('[BOOT] Loading pillar:', startPillar);
    await BSP.safeInit('FeedbackModule', typeof FeedbackModule !== 'undefined' ? FeedbackModule : null);
    await _setPillar(startPillar);
    console.log('[BOOT] Pillar loaded OK');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
      // Empfange Nachrichten vom Service Worker
      navigator.serviceWorker.addEventListener('message', async (event) => {
        if (!event.data) return;
        // Drive Backup (Background Sync)
        if (event.data.type === 'bsp:drive-sync') {
          console.log('[BSP] SW Sync-Event empfangen → Drive Backup wird ausgeführt');
          if (typeof EinstellungenModule !== 'undefined' && EinstellungenModule.backupDrive) {
            await EinstellungenModule.backupDrive();
          }
        }
        // App-Version cachen (für BSP.getAktuellerKontext)
        if (event.data.type === 'bsp:version' && event.data.version) {
          localStorage.setItem('bsp_sw_version', event.data.version);
        }
      });
    }
    console.log('--- [BOOT-V3] FINISHED ---');
  } catch(e) {
    console.error('[BOOT-CRASH]', e);
    const msg = e.message || 'Unbekannter Fehler';
    const stack = e.stack ? e.stack.split('\n')[1] : '';
    document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fdfdfd;color:#c04040;font-family:system-ui;text-align:center;padding:20px;z-index:99999">' +
      '<div style="max-width:400px">' +
        '<div style="font-size:24px;margin-bottom:10px">⚠️ Start-Fehler</div>' +
        '<div style="background:#fff1f1;padding:12px;border-radius:8px;text-align:left;font-family:monospace;font-size:12px;border:1px solid #ffcccc">' +
          '<b>' + msg + '</b><br><br><span style="opacity:0.6">' + stack + '</span>' +
        '</div>' +
        '<button onclick="location.reload()" style="margin-top:20px;padding:8px 16px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer">Seite neu laden</button>' +
      '</div>' +
    '</div>';
  }
});

// ── Onboarding / Shell Helpers ─────────────────────────────────────
function _obNext(step) {
  document.querySelectorAll('.ob-step').forEach(el => el.classList.remove('on'));
  const el = document.getElementById('obs' + step);
  if (el) el.classList.add('on');
  document.querySelectorAll('.ob-dot').forEach((d, i) => d.classList.toggle('on', i < step));
}
function _toggleObKey() {
  const inp = document.getElementById('ob_apikey');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}
async function _obFinish() {
  const vorname = document.getElementById('ob_vorname')?.value?.trim() || '';
  if (!vorname) { BSP.toast('Bitte Vornamen eingeben', 'wr'); return; }
  await BSP.saveAllSettings({ vorname, setupDone: '1' });
  document.getElementById('onboarding').classList.remove('on');
  _updateShellHeader(); BSP.showView('home');
}
function _openScanner() {
  if (typeof BSP !== 'undefined' && BSP.closeAllOverlays) BSP.closeAllOverlays();
  if (_currentPillar === 'privat' && typeof PrivatScanModule !== 'undefined') PrivatScanModule.open();
  else if (_currentPillar === 'archiv' && typeof ArchivScanModule !== 'undefined') ArchivScanModule.open();
  else if (typeof ScannerModule !== 'undefined') ScannerModule.open();
  else BSP.toast('Scanner lädt…', 'wr');
}
function _openManuell() { ScannerModule.openManuell(); }
function _updateShellHeader() {
  const s = BSP.state.settings || {};
  const pillar = _currentPillar;
  const pillarTag = document.getElementById('sh-pillar-tag');
  if (pillarTag) pillarTag.textContent = pillar.charAt(0).toUpperCase() + pillar.slice(1);
  const apiKey = s._apiKey || '';
  const keyTrigger = document.getElementById('sh-key-trigger');
  if (keyTrigger) {
    keyTrigger.style.color = apiKey ? 'var(--grn)' : 'var(--red)';
    keyTrigger.textContent = apiKey ? 'Key ✓' : 'Key 🔒';
  }
}
function _toggleApiKeyInput() {
  const wrap = document.getElementById('shell-api-input-wrap');
  if (!wrap) return;
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}
async function _saveShellApiKey() {
  const val = document.getElementById('shell-api-key')?.value?.trim();
  if (!val) return;
  await BSP.saveAllSettings({ _apiKey: val });
  document.getElementById('shell-api-input-wrap').style.display = 'none';
}
async function _renderHome() { if (typeof DashboardModule !== 'undefined') await DashboardModule.render(); }
function _openDetail(id) { BelegeModule.openDetail(id); }

BSP.on('beleg:saved', () => { _updateShellHeader(); _renderHome(); });
BSP.on('beleg:deleted', () => { _updateShellHeader(); _renderHome(); });
BSP.on('settings:saved', () => { _updateShellHeader(); });
BSP.on('view:changed', ({ name }) => { if (name === 'home') _renderHome(); });
</script>
</body>
</html>
