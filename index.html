<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BelegScan">
<meta name="theme-color" content="#070707">
<meta name="description" content="KI-gestützter Beleg-Scanner für deutsche Freiberufler">
<link rel="manifest" href="./manifest.json">
<title>BelegScan Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     TOAST (immer oben, global)
═══════════════════════════════════════════════════════════════ -->
<div id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════
     SHELL — IMMER SICHTBARER HEADER
═══════════════════════════════════════════════════════════════ -->
<div id="shell-top">
  <div class="shell-header-top">
    <div class="shell-title-box">
      <div class="shell-app-name">BelegScan Pro</div>
      <div class="shell-user-info">
        <span id="shell-name">Hallo!</span> · <span id="shell-beruf" style="opacity:.6">Bereit</span>
      </div>
    </div>
    
    <!-- Säulen-Toggle -->
    <div class="pillar-toggle" id="pillar-toggle">
      <button class="pt-btn on" id="pt-business" onclick="_setPillar('business')">💼</button>
      <button class="pt-btn" id="pt-privat" onclick="_setPillar('privat')">🏠</button>
      <button class="pt-btn" id="pt-archiv" onclick="_setPillar('archiv')">📬</button>
      <button class="pt-btn" id="pt-leben" onclick="_setPillar('leben')">🌱</button>
    </div>
  </div>

  <div class="shell-widgets">
    <!-- MwSt Widget -->
    <div class="s-widget" onclick="BSP.showView('mwst')">
      <div class="s-w-lab">MwSt-Bsp.</div>
      <div class="s-w-val" id="shell-mwst">0,00 €</div>
    </div>
    <!-- Zeitersparnis -->
    <div class="s-widget">
      <div class="s-w-lab">Gespart</div>
      <div class="s-w-val" id="shell-time-saved">0h 0m</div>
    </div>
    <!-- API Kosten -->
    <div class="s-widget">
      <div class="s-w-lab">KI-Ertrag</div>
      <div class="s-w-val" id="shell-cost-saved">0,00 € ↑</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     APP — SCROLLBARER HAUPTBEREICH
═══════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- Container für Modul-Views (wird von Modulen befüllt) -->
  <div id="module-views">

    <!-- ── HOME VIEW ──────────────────────────────────────── -->
    <div class="view on" id="v-home">
      <div class="home-hero">
        <div class="home-title" style="font-size:24px; font-weight:200; border-bottom:1px solid var(--br); padding-bottom:16px; width:100%; text-align:center">Bong-Manager</div>
      </div>
      </div>

      <!-- Quick Stats -->
      <div class="home-stats">
        <div class="stat-card">
          <div class="sc-lbl">Einnahmen (Jahr)</div>
          <div class="sc-val" id="qs-einnahmen" style="color:var(--ylw)">0 €</div>
          <div class="sc-sub" id="qs-einnahmen-cnt">0 Ausgangsrechnungen</div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Ausgaben (Jahr)</div>
          <div class="sc-val" id="qs-ausgaben" style="color:var(--blu)">0 €</div>
          <div class="sc-sub" id="qs-ausgaben-cnt">0 Belege</div>
        </div>
      </div>

      <!-- Letzte Belege -->
      <div class="recent-section" style="margin-top:16px">
        <div class="section-title">Zuletzt erfasst</div>
        <div id="recent-list">
          <div class="empty">
            Noch keine Belege.<br>
            Tippe auf 📷 um deinen ersten Beleg zu scannen.
          </div>
        </div>
      </div>
    </div>

    <!-- ── Weitere Views werden von Modulen befüllt ─────── -->
    <!-- Scanner, Belege, MwSt, Steuer, Fahrt, Einstellungen -->
    <div id="v-verpflegung" class="view"></div>
    <div id="v-einstellungen" class="view"></div>

    <!-- Leben Views -->
    <div id="v-leben-home" class="view"></div>
    <div id="v-leben-entwicklung" class="view"></div>
    <div id="v-leben-inflation" class="view"></div>
    <div id="v-leben-split" class="view"></div>

    <!-- Archiv Extensions -->
    <div id="v-archiv-reise" class="view"></div>
    <div id="v-archiv-tagebuch" class="view"></div>

  </div><!-- /module-views -->
</div><!-- /app -->

<!-- ═══════════════════════════════════════════════════════════
     SCANNER OVERLAY (wird von scanner.js befüllt)
═══════════════════════════════════════════════════════════════ -->
<div id="scan-ovl"></div>

<!-- ═══════════════════════════════════════════════════════════
     HAUPT-NAVIGATION
═══════════════════════════════════════════════════════════════ -->
<nav id="shell-nav"></nav>

<!-- ── UNIVERSAL ACTION BAR (The Trio) ── -->
<div class="action-bar" id="action-bar">
  <!-- Mikrofon -->
  <button class="ab-btn" onclick="SpracheUniversal.open()" aria-label="Sprache">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
  </button>
  
  <!-- Kamera (Mitte, Groß) -->
  <div style="position:relative">
    <div id="deadline-ring-box">
      <div id="deadline-label" class="ab-label">Abgabe in 10d</div>
      <svg class="ab-ring-svg" viewBox="0 0 96 96">
        <circle class="ab-ring-bg" cx="48" cy="48" r="44"/>
        <circle id="deadline-ring-fill" class="ab-ring-fill" cx="48" cy="48" r="44"/>
      </svg>
    </div>
    <button class="ab-btn ab-btn-main" onclick="ScannerModule.open()" aria-label="Scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>

  <!-- Stift -->
  <button class="ab-btn" onclick="StiftModule.open()" aria-label="Manuell">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SCRIPTS — Core zuerst, dann Module
═══════════════════════════════════════════════════════════════ -->
<script src="./core.js"></script>
<script src="./js/onboarding.js"></script>
<script src="./js/business/business-shell.js"></script>
<script src="./js/privat/privat-shell.js"></script>
<script src="./js/privat/privat-spending.js"></script>
<script src="./js/privat/privat-energie.js"></script>

<script src="./js/privat/privat-deals.js"></script>
<script src="./js/archiv/archiv-shell.js"></script>
<script src="./js/archiv/archiv-docs.js"></script>
<script src="./js/archiv/archiv-fristen.js"></script>
<script src="./js/archiv/archiv-reise.js"></script>
<script src="./js/archiv/archiv-tagebuch.js"></script>
<script src="./js/leben/leben-shell.js"></script>
<script src="./js/leben/leben-core.js"></script>
<script src="./js/leben/leben-home.js"></script>
<script src="./js/leben/leben-entwicklung.js"></script>
<script src="./js/leben/leben-inflation.js"></script>
<script src="./js/leben/leben-split.js"></script>
<script src="./js/sprache-universal.js"></script>
<script src="./js/input-stift.js"></script>
<script src="./js/dashboard.js"></script>
<script src="./js/notifications.js"></script>
<script src="./js/business/einstellungen.js"></script>
<script src="./js/business/scanner.js"></script>
<script src="./js/business/sprache.js"></script>
<script src="./js/business/belege.js"></script>
<script src="./js/business/mwst.js"></script>
<script src="./js/business/steuer.js"></script>
<script src="./js/business/fahrt.js"></script>
<script src="./js/business/verpflegung.js"></script>
<script src="./js/business/export.js"></script>

<script>
// ── Shell-Logik (nur was wirklich in der Shell bleiben muss) ──
let _currentPillar = 'business'; // 'business', 'privat', 'archiv'

function _setPillar(p) {
  _currentPillar = p;
  
  // Theme-Klasse für CSS Transitions
  document.body.className = 'p-' + p;

  // Header-Buttons (Pillar Toggle)
  document.querySelectorAll('.pt-btn').forEach(b => {
    b.classList.toggle('on', b.id === 'pt-' + p);
  });

  // Deadline-Ring Box Sichtbarkeit
  const dlBox = document.getElementById('deadline-ring-box');
  if (dlBox) dlBox.style.display = p === 'business' ? 'block' : 'none';

  // Navigation je nach Säule
  if (p === 'business') {
    const nav = document.getElementById('shell-nav');
    if (nav) {
      nav.innerHTML = `
        <button class="nav-btn on" data-nav="home" onclick="BSP.showView('home')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-nav="belege" onclick="BSP.showView('belege')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
          <span>Belege</span>
        </button>
        <button class="nav-btn" data-nav="mwst" onclick="BSP.showView('mwst')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <span>MwSt</span>
        </button>
        <button class="nav-btn" data-nav="einstellungen" onclick="BSP.showView('einstellungen')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Setup</span>
        </button>
      `;
    }
    BSP.showView('home');
    _updateDeadlineRing();
  } else if (p === 'privat' && typeof PrivatShell !== 'undefined') {
    PrivatShell.activate();
  } else if (p === 'archiv' && typeof ArchivShell !== 'undefined') {
    ArchivShell.activate();
  } else if (p === 'leben' && typeof LebenShell !== 'undefined') {
    LebenShell.activate();
  }

  BSP.emit('pillar:changed', { pillar: p });
}
let _appMode = localStorage.getItem('bsp_mode') || 'biz';

// ── Onboarding ─────────────────────────────────────────────
function _obNext(step) {
  document.querySelectorAll('.ob-step').forEach(el => el.classList.remove('on'));
  const el = document.getElementById('obs' + step);
  if (el) el.classList.add('on');
  // Progress dots
  document.querySelectorAll('.ob-dot').forEach((d, i) => d.classList.toggle('on', i < step));
}

function _toggleObKey() {
  const inp = document.getElementById('ob_apikey');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function _obFinish() {
  const vorname  = document.getElementById('ob_vorname')?.value?.trim() || '';
  const nachname = document.getElementById('ob_nachname')?.value?.trim() || '';
  const beruf    = document.getElementById('ob_beruf')?.value?.trim() || '';
  const steuernr = document.getElementById('ob_steuernr')?.value?.trim() || '';
  const apiKey   = document.getElementById('ob_apikey')?.value?.trim() || '';

  if (!vorname) {
    BSP.toast('Bitte deinen Vornamen eingeben', 'wr');
    document.getElementById('ob_vorname')?.focus();
    return;
  }

  await BSP.saveAllSettings({
    vorname, nachname, beruf, steuernr,
    _apiKey: apiKey,
    setupDone: '1',
    stbSatz: '120',
    minProScan: '4',
    belegFmt: 'A'
  });

  document.getElementById('onboarding').classList.remove('on');
  _updateShellHeader();
  BSP.showView('home');
  BSP.toast('Willkommen, ' + vorname + '! 🎉', 'ok');
}

// ── Mode Toggle ─────────────────────────────────────────────
function _setMode(m) {
  _appMode = m;
  localStorage.setItem('bsp_mode', m);
  document.getElementById('modeBiz').classList.toggle('on', m === 'biz');
  document.getElementById('modeBiz').classList.toggle('biz', true);
  document.getElementById('modePriv').classList.toggle('on', m === 'priv');
  BSP.emit('mode:changed', { mode: m });
  _renderHome();
}

// ── Scanner / Sprache öffnen ────────────────────────────────
function _openScanner() {
  // Wird von scanner.js übernommen (BSP.on('core:ready') → Modul registriert sich)
  if (typeof ScannerModule !== 'undefined') ScannerModule.open();
  else BSP.toast('Scanner lädt…', 'wr');
}

function _openSprache() {
  if (typeof SpracheModule !== 'undefined') SpracheModule.open();
  else BSP.toast('Sprachmodul lädt…', 'wr');
}

function _openManuell() {
  if (typeof ScannerModule !== 'undefined') ScannerModule.openManuell();
  else BSP.toast('Scanner lädt…', 'wr');
}

// ── Shell Header aktualisieren ─────────────────────────────
function _updateShellHeader() {
  const s = BSP.state.settings || {};

  // Name
  const nameEl = document.getElementById('shell-name');
  if (nameEl) nameEl.textContent = [s.vorname, s.nachname].filter(Boolean).join(' ') || '—';

  const berufEl = document.getElementById('shell-beruf');
  if (berufEl && s.beruf) berufEl.textContent = s.beruf;

  // MwSt-Saldo
  const saldo = BSP.state.mwstSaldo || 0;
  const mwstEl = document.getElementById('shell-mwst');
  if (mwstEl) {
    mwstEl.textContent = BSP.fm(Math.abs(saldo)) + ' €' + (saldo < 0 ? ' ↓' : '');
    mwstEl.className = 'sw-val ' + (saldo >= 0 ? 'red' : 'green');
  }

  // Zeitersparnis
  const ts = BSP.getTimeSaved();
  const timeEl = document.getElementById('shell-time-saved');
  if (timeEl) timeEl.textContent = ts.formatted;

  // API-Kostenvorteil
  const cc = BSP.getCostComparison();
  const costEl = document.getElementById('shell-cost-saved');
  if (costEl) {
    costEl.textContent = BSP.fm(cc.saved) + ' €';
    costEl.className = 'sw-val ' + (cc.saved >= 0 ? 'green' : 'red');
  }

  // MwSt-Deadline
  const now = new Date();
  const deadline = new Date(now.getFullYear(), now.getMonth() + 1, 10);
  const dLeft = Math.max(0, Math.ceil((deadline - now) / 864e5));
  const deadlineEl = document.getElementById('shell-deadline-val');
  if (deadlineEl) {
    deadlineEl.textContent = dLeft + ' Tage';
    deadlineEl.style.color = dLeft <= 3 ? 'var(--red)' : dLeft <= 7 ? 'var(--orn)' : 'var(--grn)';
  }
}

// ── Home View Rendering ───────────────────────────────────────
async function _renderHome() {
  if (typeof DashboardModule !== 'undefined') {
    await DashboardModule.render();
  }
}

function _openDetail(id) {
  if (typeof BelegeModule !== 'undefined') BelegeModule.openDetail(id);
}

// ── Event-Listener für Shell-Updates ─────────────────────────
BSP.on('beleg:saved', () => { _updateShellHeader(); _renderHome(); });
BSP.on('beleg:deleted', () => { _updateShellHeader(); _renderHome(); });
BSP.on('mwst:updated', () => { _updateShellHeader(); });
BSP.on('api:used', () => { _updateShellHeader(); });
BSP.on('settings:saved', () => { _updateShellHeader(); });
BSP.on('view:changed', ({ name }) => {
  document.querySelectorAll('[data-nav]').forEach(n => n.classList.remove('on'));
  const navEl = document.querySelector(`[data-nav="${name}"]`);
  if (navEl) navEl.classList.add('on');
  if (name === 'home') _renderHome();
});

// ── Deadline-Ring aktualisieren ──────────────────────────────
function _updateDeadlineRing() {
  const dl = BSP.getNextDeadline();
  const ring = document.getElementById('deadline-ring-fill');
  const lbl = document.getElementById('deadline-label');
  const box = document.getElementById('deadline-ring-box');

  if (!ring) return;

  // Sichtbarkeit je nach Säule
  if (box) box.style.display = _currentPillar === 'business' ? 'block' : 'none';

  // Kreisumfang: 2 * π * 44 ≈ 276.46
  // Aber dasharray im CSS ist 245? Lassen wir es berechnen:
  const r = 44;
  const circ = 2 * Math.PI * r;
  ring.style.strokeDasharray = circ;

  const maxDays = dl.rhythmus === 'jaehrlich' ? 365 : dl.rhythmus === 'halbjahr' ? 183 : dl.rhythmus === 'quartal' ? 92 : 31;
  const fraction = Math.min(1, dl.daysLeft / maxDays);
  const offset = circ * (1 - fraction);

  ring.style.strokeDashoffset = offset;
  
  if (dl.daysLeft <= 3) ring.style.stroke = 'var(--red)';
  else if (dl.daysLeft <= 7) ring.style.stroke = 'var(--orn)';
  else ring.style.stroke = 'var(--grn)';

  if (lbl) {
    lbl.textContent = dl.daysLeft <= 7 ? `${dl.daysLeft}d Abgabe` : 'Frist';
    lbl.style.color = dl.daysLeft <= 3 ? 'var(--red)' : dl.daysLeft <= 7 ? 'var(--orn)' : 'var(--accent)';
  }
}

// ── App Start ───────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await BSP.init();
    
    // Initial Business-Pillar laden
    _setPillar('business');
    _updateShellHeader();
    await _renderHome();

    // Module initialisieren (Reihenfolge: dependencies first)
    if (typeof OnboardingModule !== 'undefined') OnboardingModule.init();
    if (typeof BusinessShell !== 'undefined') BusinessShell.init();
    if (typeof PrivatShell !== 'undefined') PrivatShell.init();
    if (typeof PrivatSpending !== 'undefined') PrivatSpending.init();
    if (typeof PrivatEnergie !== 'undefined') PrivatEnergie.init();
    if (typeof PrivatDeals !== 'undefined') PrivatDeals.init();
    if (typeof PrivatZiele !== 'undefined') PrivatZiele.init();
    if (typeof ArchivShell !== 'undefined') ArchivShell.init();
    if (typeof ArchivDocs !== 'undefined') ArchivDocs.init();
    if (typeof ArchivFristen !== 'undefined') ArchivFristen.init();
    if (typeof ArchivAntwort !== 'undefined') ArchivAntwort.init();
    if (typeof ArchivKontext !== 'undefined') ArchivKontext.init();
    if (typeof SpracheUniversal !== 'undefined') SpracheUniversal.init();
    if (typeof StiftModule !== 'undefined') StiftModule.init();
    if (typeof DashboardModule !== 'undefined') { /* kein init nötig */ }
    if (typeof NotificationModule !== 'undefined') NotificationModule.init();
    if (typeof EinstellungenModule !== 'undefined') EinstellungenModule.init();
    if (typeof ScannerModule !== 'undefined') ScannerModule.init();
      if (typeof ArchivShell !== 'undefined' && ArchivShell.init) ArchivShell.init();
      if (typeof LebenShell !== 'undefined' && LebenShell.init) LebenShell.init();
      if (typeof LebenHome !== 'undefined') LebenHome.init();
      if (typeof LebenCore !== 'undefined') LebenCore.init();
      if (typeof LebenSplit !== 'undefined') LebenSplit.init();
      if (typeof LebenInflation !== 'undefined') LebenInflation.init();
      if (typeof LebenEntwicklung !== 'undefined') LebenEntwicklung.init();
      if (typeof ArchivReise !== 'undefined') ArchivReise.init();
      if (typeof ArchivTagebuch !== 'undefined') ArchivTagebuch.init();
      if (typeof BelegeModule !== 'undefined') BelegeModule.init();
    if (typeof MwStModule !== 'undefined') MwStModule.init();
    if (typeof SteuerModule !== 'undefined') SteuerModule.init();
    if (typeof FahrtModule !== 'undefined') FahrtModule.init();
    if (typeof VerpflegungModule !== 'undefined') VerpflegungModule.init();
    if (typeof ExportModule !== 'undefined') ExportModule.init();

    // Shell-Header befüllen
    _updateShellHeader();
    _updateDeadlineRing();

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
    }
  } catch(e) {
    console.error('App init error:', e);
    document.body.innerHTML += `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070707;color:#c04040;font-family:system-ui;text-align:center;padding:20px;z-index:99999">
      <div>Fehler beim Starten:<br><code style="font-size:12px">${e.message}</code></div>
    </div>`;
  }
});
</script>
</body>
</html>
